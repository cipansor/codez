name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install trunk
        uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: latest

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build frontend
        working-directory: crates/frontend
        run: trunk build --release

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No `needs: [rust, frontend]`: this job runs in a fresh workspace and
    # produces its own build, so it does not consume the frontend job's
    # artifact. The dependency was a false signal, not a build reuse. The
    # `rust` and `frontend` jobs still gate merges; they just are not
    # prerequisites for running e2e.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install trunk
        uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: latest

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Build both binaries up front so the servers below start immediately.
      # This job has no warm cargo cache, so a cold `cargo run`/`trunk serve`
      # would otherwise spend minutes compiling while the readiness poll below
      # is already counting down. Building here also surfaces a compile error
      # in its own step instead of as an opaque "servers did not become ready".
      - name: Build backend
        run: cargo build -p backend

      - name: Build frontend
        working-directory: crates/frontend
        run: trunk build

      - name: Start servers
        run: |
          nohup cargo run -p backend > backend.log 2>&1 &
          (cd crates/frontend && nohup trunk serve > trunk.log 2>&1 &)

      - name: Wait for servers
        run: |
          # Generous window: `trunk serve` may still rebuild after the
          # pre-build above, and the first run has no cached toolchain.
          # Probe an endpoint the port actually serves: Gitea has no
          # `/api/v1/repos` list (it 404s), so use `/api/v1/version`.
          for _ in $(seq 1 150); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null \
               && curl -sf http://127.0.0.1:8080/api/v1/version >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "servers did not become ready" >&2
          cat backend.log crates/frontend/trunk.log 2>/dev/null || true
          exit 1

      - name: Run Playwright
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload server logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: server-logs
          path: |
            backend.log
            crates/frontend/trunk.log
          retention-days: 7
